<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="sesion.css">
</head>



<body class="d-flex align-items-center justify-content-center vh-100">

    <main class="form-signin text-center" style="max-width: 350px; width:100%;">

        <form>
            <img class="mb-4" src="img/logo xo.jpg" alt="" width="72" height="57">

            <h1 class="h3 mb-3 fw-normal">Inicio de sesion</h1>

            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Correo electronico</label>
            </div>

            <div class="form-floating mt-2">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Contraseña</label>
            </div>

            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                    Recuerdame
                </label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Iniciar sesion</button>

        </form>

    </main>

</body>



</html>
